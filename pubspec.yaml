name: plainleaf
description: "素页 PlainLeaf - 本地优先的图文记录工具"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

# Windows 宿主 flutter test 兼容性钉版：path_provider 2.1.6 链上的 objective_c/jni
# native assets hook 与 Flutter 3.47.2 主机测试不兼容（Architecture.arm64e 编译失败）
dependency_overrides:
  path_provider_foundation: 2.4.1
  path_provider_android: 2.2.10

# 依赖分组与版本基线：plainleaf-resources/pub-dependencies/README.md（阶段 0-1 组）
# 依据：docs/DEVELOPMENT.md §二 技术栈锁定 + §4.3 数据模型
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理与路由（架构红线：只用 Riverpod + go_router）
  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0

  # 数据层：Drift(SQLite+FTS5)（§4.3；FTS 同步走 Repository 事务内双写，不用 trigger）
  drift: ^2.20.0
  drift_flutter: ^0.2.0          # drift 官方连接助手（跨平台打开数据库）
  sqlite3_flutter_libs: ^0.5.0   # Android/iOS 自带 SQLite（含 FTS5）
  path_provider: ^2.1.0          # 私有目录（媒体文件 W4 使用，数据层先行依赖）
  uuid: ^4.4.0                   # §4.3 五字段 uuid 必需
  sqlite3: ^2.4.0                # 宿主机内存库测试用（drift 传递依赖，显式声明过 lint）

  # 富文本编辑器（W3：Delta JSON 持久化；quill 内嵌图片混排按深坑预案延后，W4 走附件条模式）
  flutter_quill: ^11.6.0

  # W4 图片输入：系统相册/拍照（系统选择器免运行时权限）；压缩/缩略图 W6
  image_picker: ^1.1.0
  path: ^1.9.0                   # MediaStorage 路径拼接（传递依赖显式声明）

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.20.0
  path_provider_platform_interface: ^2.1.0  # 测试桩：媒体存储路径覆盖

flutter:
  uses-material-design: true