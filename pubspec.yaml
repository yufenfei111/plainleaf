name: plainleaf
description: "素页 PlainLeaf - 本地优先的图文记录工具"
publish_to: 'none'
# 版本号唯一真源（W14 起）：`里程碑线+buildNumber`，buildNumber = 周次，单调递增。
# 关于页显示的版本来自 lib/app/app_version.dart，由 tool/check_version.dart 校验一致，
# CI 会跑这个校验 —— 改这里就必须同步改那边，否则流水线直接红。
# 历史教训：0.2.0+2 从 W10 末端一路用到 W14（横跨 W11–W14 四个周次的工作量，
# 含 M3 里程碑；日历时间 9/22–9/26），装上去看不出任何变化，
# 而且 W10 已经"修正版本号停滞"过一次，靠"记得手改"防不住，只能靠机械校验。
version: 0.4.0-beta+20

environment:
  sdk: ^3.13.2

# Windows 宿主 flutter test 兼容性钉版：path_provider 2.1.6 链上的 objective_c/jni
# native assets hook 与 Flutter 3.47.2 主机测试不兼容（Architecture.arm64e 编译失败）
dependency_overrides:
  path_provider_foundation: 2.4.1
  path_provider_android: 2.2.10

# 依赖分组与版本基线：plainleaf-resources/pub-dependencies/README.md（阶段 0-1 组）
# 依据：docs/DEVELOPMENT.md §二 技术栈锁定 + §4.3 数据模型
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理与路由（架构红线：只用 Riverpod + go_router）
  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0

  # 数据层：Drift(SQLite+FTS5)（§4.3；FTS 同步走 Repository 事务内双写，不用 trigger）
  drift: ^2.20.0
  drift_flutter: ^0.2.0          # drift 官方连接助手（跨平台打开数据库）
  sqlite3_flutter_libs: ^0.5.0   # Android/iOS 自带 SQLite（含 FTS5）
  path_provider: ^2.1.0          # 私有目录（媒体文件 W4 使用，数据层先行依赖）
  uuid: ^4.4.0                   # §4.3 五字段 uuid 必需
  sqlite3: ^2.4.0                # 宿主机内存库测试用（drift 传递依赖，显式声明过 lint）

  # 富文本编辑器（W3：Delta JSON 持久化；quill 内嵌图片混排按深坑预案延后，W4 走附件条模式）
  flutter_quill: ^11.6.0

  # W4 图片输入：系统相册/拍照（系统选择器免运行时权限）；压缩/缩略图 W6
  image_picker: ^1.1.0
  path: ^1.9.0                   # MediaStorage 路径拼接（传递依赖显式声明）
  archive: ^3.6.0                # .plbk 备份包 zip 打包（清单基线阶段 4 组，W5 预支）

  # W6 图片管线：两级缩略图 + Isolate 转码（§4.3 媒体文件；性能红线 60fps）
  image: ^4.2.0                  # 解码/缩放/编码与 EXIF 方向烘焙（纯 Dart，在 isolate 内跑）
  crypto: ^3.0.6                 # hash_sha256（§4.3 修正 ①，资产去重与完整性校验）

  # W14 安全与导出（§三 阶段 4）：AES-GCM 加密选项 + 应用锁 + Markdown/PDF 导出
  cryptography: ^2.7.0           # AES-256-GCM / PBKDF2-HMAC-SHA256 / HKDF（纯 Dart，无平台通道）
  flutter_secure_storage: ^9.2.0 # §4.3：密钥必须入系统安全容器，不进 shared_preferences/代码
  local_auth: ^2.3.0             # 应用锁的生物识别快速解锁（不可用时不阻塞，降级到密码）
  pdf: ^3.11.0                   # PDF 导出（纯 Dart 生成，不依赖打印服务）

  # W15 相册：把图片保存到系统相册（Android/iOS）。桌面端走"落盘到下载目录"降级，
  # 见 lib/core/media/image_saver.dart —— 桌面没有"系统相册"这个概念。
  gal: ^2.3.0

  # W17 多格式附件：从本机选任意类型的文件挂到记录上。
  # 平台通道依赖 —— 本机 flutter test 覆盖不到，必须真机走查（见 W14 的教训）。
  #
  # ⚠️ 为什么不用 file_picker（试过三轮，条条堵死，别再回头试）：
  #   - 13.x：依赖 windows_file_picker 2 → win32 ^6.3，与 flutter_secure_storage 9.2
  #     链上的 win32 ^5.0 冲突；
  #   - 12.x：后期版本同样拉 windows_file_picker ^1.3 → win32 ^6.3，冲突同上；
  #   - 11.x：能解析，但在本项目的 **AGP 9.1.0** 下会跳过 Kotlin 插件的应用
  #     （其脚本里有 `if (!isAgp9OrAbove) apply kotlin`），而它的源码是 Kotlin ——
  #     于是 FilePickerPlugin 根本没被编译出来，release 构建在 Javac 阶段报
  #     「找不到符号: 类 FilePickerPlugin」。
  # 改用 Flutter 官方的 file_selector：依赖树干净（file_selector_windows 不碰 win32）、
  # API 面更小（只需要 openFile），且由 flutter/packages 维护。
  file_selector: ^1.1.0
  # W17：非内置预览的类型（文档/压缩包/未知格式）交给系统应用打开。
  # 同样走平台通道，必须真机验证。
  open_filex: ^4.7.0

  # W20 P1-9：音频封面与时长。
  # **纯 Dart**（自己解析 ID3v2 / MP4 ilst / Vorbis Comments），不走平台通道 ——
  # 与 file_selector / open_filex / gal 不同，它**不需要真机验证**，
  # 是本阶段唯一能"本机验完再交付"的 P1 项。`assets.durationMs` 字段
  # W4 建表时就预留了，这里只是把它填上。
  audio_metadata_reader: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.20.0
  path_provider_platform_interface: ^2.1.0  # 测试桩：媒体存储路径覆盖
  # W16 图标生成：一次性工具，只进开发依赖，不进运行时、不增大包体
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# W16 启动图标（阶段 5 发布）。
#
# 源图说明（勿随手替换）：
#   fullbleed   米色底 #FCF2E5 + 深棕标记 #3A3026 的满幅图，供传统图标与 Windows 使用。
#               已确保**无 alpha 通道** —— 原稿有约 1% 像素带半透明（图案边缘的导出残余），
#               不拍平会在部分 launcher 上沿图案边缘露出一圈异色描边。
#   foreground  透明底标记，供 Android 8+ 自适应图标的前景层使用。
#               其内容占画布 61.9%，正好落在自适应图标 66% 安全区规范内（原设计即按规范出图）。
#
# iOS 暂不生成：W16 只发 APK + Windows 包，且 iOS 图标另有"强制不透明"的硬要求，
# 需真机通道齐备后一并处理（届时复用同一份 fullbleed 即可）。
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app-icon-fullbleed.png"
  adaptive_icon_background: "#FCF2E5"
  adaptive_icon_foreground: "assets/branding/app-icon-foreground.png"
  # Windows 必须关闭工具生成：它的 windows.icon_size 默认 48，
  # 只会产出**单张 48x48** 的 ico —— 比 Flutter 模板原本的 4 尺寸（16/32/48/256）还差，
  # 高 DPI 任务栏与 Alt-Tab 会明显发虚。而我们的素材 app-icon.ico 内含 7 个尺寸
  # （16/24/32/48/64/128/256），是更完整的成品。
  # 所以改由 run_icons.bat 把素材直接复制过去，不经过工具。
  windows:
    generate: false
