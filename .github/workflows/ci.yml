# 素页 PlainLeaf · CI（DEVELOPMENT.md §5.2：push/PR 跑 analyze + test）
# Flutter 版本与 .fvmrc 保持一致（3.47.2）；生成文件 *.g.dart 已入库，CI 无需 build_runner。
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Drift 宿主机测试需要系统 SQLite（含 FTS5）
      - name: Install sqlite3 dev library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2' # 与 .fvmrc 一致，改版本时两处同步
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      # 版本号曾经从 W10 停到 W14 没人动（0.2.0+2 用了 4 周），
      # 原因是没有任何机械约束。这一步把它变成门禁：
      # pubspec.yaml 的 version 必须与 lib/app/app_version.dart 一致。
      - name: 版本号一致性（pubspec ↔ app_version.dart）
        run: dart run tool/check_version.dart

      - name: analyze（0 警告门禁）
        run: flutter analyze --fatal-infos

      - name: test
        run: flutter test